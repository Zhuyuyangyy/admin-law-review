name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linter
        run: pip install ruff
      - name: Lint with ruff
        run: |
          ruff check backend/ tests/
          ruff format --check backend/ tests/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=backend/app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install safety
        run: pip install safety
      - name: Check dependencies for vulnerabilities
        run: safety check -r backend/requirements.txt
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build -t admin-law-review:ci .
      - name: Verify container starts
        run: |
          docker run -d --name alr-test -p 8000:8000 admin-law-review:ci
          sleep 10
          curl -f http://localhost:8000/health || exit 1
          docker stop alr-test
      - name: Run tests in container
        run: |
          docker run --rm admin-law-review:ci python -c "from app.services.case_parser import CaseParser; print('Import OK')"

  deploy:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build and tag image
        run: |
          docker build -t admin-law-review:${{ github.sha }} .
          docker tag admin-law-review:${{ github.sha }} admin-law-review:latest
      - name: Verify deployment readiness
        run: |
          echo "Docker image built successfully"
          echo "Image tag: admin-law-review:${{ github.sha }}"
          echo "Ready for deployment"
